<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b132b; }
      .accent { fill: #ffb703; }
      .light { fill: #ffffff; }
      .gray { fill: #5c7aff; }
      .text-main { font-family: 'Montserrat', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 38px; fill: #ffffff; letter-spacing: 1px; }
      .text-sub { font-family: 'Montserrat', 'Helvetica Neue', sans-serif; font-weight: 500; font-size: 13px; fill: #5c7aff; letter-spacing: 5px; }
    </style>
  </defs>

  <!-- Fondo Corporativo Oscuro (Ecosistema de Grupo) -->
  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Isotipo: Fusión Escudo de Protección, Estrella (Guño Chileno) y Código (</>) -->
  <g transform="translate(45, 45)">
    <!-- Bracket Izquierdo / Respaldo (<) -->
    <path d="M 35 110 L 10 70 L 35 30" stroke="#ffb703" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Escudo Central de Protección -->
    <path d="M 50 35 L 100 35 L 100 75 C 100 95, 75 115, 75 115 C 75 115, 50 95, 50 75 Z" fill="#ffffff" />
    <path d="M 75 35 L 100 35 L 100 75 C 100 95, 75 115, 75 115 Z" fill="#ffffff" opacity="0.15" />
    
    <!-- Estrella de 4 puntas interna (Toque de Guía/Seguridad) -->
    <path d="M 75 48 L 78 60 L 90 63 L 78 66 L 75 78 L 72 66 L 60 63 L 72 60 Z" fill="#0b132b" />
    
    <!-- Bracket Derecho / Respaldo (>) -->
    <path d="M 115 30 L 140 70 L 115 110" stroke="#5c7aff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Tipografía Profesional INSURE-BYTE -->
  <text x="215" y="102" class="text-main">INSURE<tspan class="accent">-</tspan>BYTE</text>
  <text x="218" y="132" class="text-sub">INSURANCE SERVICES</text>
</svg>
