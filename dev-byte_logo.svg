<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b132b; }
      .accent { fill: #ff4d6d; }
      .light { fill: #ffffff; }
      .gray { fill: #5c7aff; }
      .text-main { font-family: 'Montserrat', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; letter-spacing: 1px; }
      .text-sub { font-family: 'Montserrat', 'Helvetica Neue', sans-serif; font-weight: 500; font-size: 14px; fill: #5c7aff; letter-spacing: 7px; }
    </style>
  </defs>

  <!-- Fondo Corporativo Oscuro -->
  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Isotipo: Fusión Cordillera de los Andes y Código (</>) -->
  <g transform="translate(55, 45)">
    <!-- Bracket Izquierdo / Base Montaña (<) -->
    <path d="M 35 110 L 10 70 L 35 30" stroke="#ff4d6d" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Cumbre de los Andes Central -->
    <polygon points="40,110 75,35 110,110" class="light" />
    <polygon points="75,35 110,110 75,110" class="light" opacity="0.15" />
    
    <!-- Bracket Derecho / Base Montaña (>) -->
    <path d="M 115 30 L 140 70 L 115 110" stroke="#5c7aff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Tipografía Profesional DEV-BYTE -->
  <text x="230" y="102" class="text-main">DEV<tspan class="accent">-</tspan>BYTE</text>
  <text x="233" y="132" class="text-sub">WEB DEVELOPMENT</text>
</svg>
